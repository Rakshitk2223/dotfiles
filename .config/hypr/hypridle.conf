# ~/.config/hypr/hypridle.conf

general {
    lock_cmd = pidof hyprlock || hyprlock       # Command to lock the screen
    unlock_cmd = pkill -x hyprlock              # Command to unlock
    before_sleep_cmd = loginctl lock-session    # Command to run before sleep
    after_sleep_cmd = hyprctl dispatch dpms on  # Command to run after sleep
    ignore_dbus_inhibit = false                 # Do not idle if a media player is running
}

# This listener turns the screen off after 5 minutes of inactivity
listener {
    timeout = 600                                # 300 seconds = 5 minutes
    on-timeout = hyprctl dispatch dpms off       # Command to turn screen off
    on-resume = hyprctl dispatch dpms on         # Command to turn screen back on when resumed
}

# This listener locks the screen after 10 minutes of inactivity
listener {
    timeout = 1200                                # 600 seconds = 10 minutes
    on-timeout = loginctl lock-session           # This is a more robust way to lock
}

# This listener suspends the system after 30 minutes of inactivity
listener {
    timeout = 1800                              # 1800 seconds = 30 minutes
    on-timeout = systemctl suspend               # Command to suspend the system
}
