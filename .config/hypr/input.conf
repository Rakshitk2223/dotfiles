#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_options = ctrl:nocaps
    follow_mouse = 1

    touchpad {
        natural_scroll = yes
    }

    sensitivity = 0
    force_no_accel = 1
    numlock_by_default = true
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
# New gesture system for Hyprland 0.51+
gestures {
    # 3-finger swipes for workspace navigation
    gesture = 3, swipe, left, workspace, +1
    gesture = 3, swipe, right, workspace, -1
    
    # 4-finger swipes for window management
    gesture = 4, swipe, up, togglefloating
    gesture = 4, swipe, down, fullscreen
    gesture = 4, swipe, left, movetoworkspace, special
    gesture = 4, swipe, right, togglespecialworkspace
    
    # Pinch gestures for overview and zoom
    gesture = 2, pinch, out, overview
    gesture = 2, pinch, in, exec, hyprctl dispatch workspace previous
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic mouse V1
    sensitivity = -0.5
}