# ASUS-specific configuration
# This file is only sourced on ASUS laptops (detected via supergfxctl)
# For ASUS ROG/TUF laptops with supergfxctl GPU switching

# Hardcoded DRM device order for supergfxctl compatibility
# card0 = NVIDIA, card1 = AMD (typical ASUS ROG configuration)
env = AQ_DRM_DEVICES,/dev/dri/card0:/dev/dri/card1
