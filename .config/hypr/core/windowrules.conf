# Window Rules - Core Defaults
# ============================
# Add your custom window rules to local/windowrules.conf

# Ignore maximize requests from apps
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# File manager operations
windowrulev2 = float, class:^(Thunar)$, title:^(File Operation Progress)$

# Zen Browser Picture-in-Picture window
windowrulev2 = float, class:^(zen)$, title:^(Picture-in-Picture)$
windowrulev2 = pin, class:^(zen)$, title:^(Picture-in-Picture)$
windowrulev2 = move 100%-670 100%-420, class:^(zen)$, title:^(Picture-in-Picture)$
windowrulev2 = size 650 400, class:^(zen)$, title:^(Picture-inPicture)$

# Steam windows
windowrulev2 = float, class:^(Steam)$, title:^(Friends List)$
windowrulev2 = float, class:^(Steam)$, title:^(Steam - News)$

# Pavucontrol
windowrulev2 = float, class:^(Pavucontrol)$

# Bluetooth Manager (assuming Blueman)
windowrulev2 = float, class:^(Blueman-manager)$
