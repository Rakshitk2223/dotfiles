#################
### AUTOSTART ###
#################

# First-run setup (applies GTK settings on first login after install)
exec-once = $HOME/.local/bin/dotfiles-first-run

# Autostart necessary processes (like notifications daemons, status bars, etc.)
exec-once = GTK_THEME=Graphite-Dark nm-applet --indicator
exec-once = blueman-applet & swww-daemon & 
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = waybar
exec-once = dunst & hypridle &
exec-once = ~/.local/bin/scripts/set-permissions.sh
exec-once = kwalletd5
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP # for XDPH
exec-once = dbus-update-activation-environment --systemd --all # for XDPH
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP # for XDPH
exec-once = systemctl --user start xdg-desktop-portal