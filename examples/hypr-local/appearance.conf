# Local appearance.conf - Add your overrides here
# Glass-like Transparency Effect - Overrides core/appearance.conf

decoration {
    active_opacity = 0.55
    inactive_opacity = 0.40

    blur {
        enabled = true
        size = 12
        passes = 3
        vibrancy = 0.25
        brightness = 1.0
        contrast = 1.0
        noise = 0.02
        new_optimizations = true
        xray = false
        ignore_opacity = false
    }
}

# Adjust these values to customize your glass effect:
# 
# OPACITY (0.0 = fully transparent, 1.0 = fully opaque):
#   active_opacity   - Transparency of focused window (0.75-0.85 recommended)
#   inactive_opacity - Transparency of unfocused windows (0.65-0.75 recommended)
#
# BLUR (frosted glass effect):
#   size             - Blur radius (8-15, higher = more blur)
#   passes           - Quality/smoothness (2-4, higher = smoother but slower)
#   vibrancy         - Color intensity through blur (0.1-0.4)
#   brightness       - Brightness adjustment (0.8-1.2)
#   contrast         - Contrast adjustment (0.8-1.2)
#   noise            - Subtle texture (0.01-0.05, adds grain)
#   xray             - See through blur completely (true/false)
#   new_optimizations - Performance improvements (true/false)
#
# TIPS:
# - For more dramatic effect: lower opacity values (0.70/0.60)
# - For stronger frost: increase size (15+) and passes (4)
# - For glass texture: increase noise (0.03-0.05)
# - Performance issues? Lower passes to 2, size to 8
