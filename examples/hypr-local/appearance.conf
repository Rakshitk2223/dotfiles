# Example local appearance overrides
# Copy to: ~/.config/hypr/local/appearance.conf

# Custom gaps (smaller than default)
general {
    gaps_in = 3
    gaps_out = 6
}

# Custom border colors (catppuccin-inspired)
general {
    col.active_border = rgba(cba6f7ff) rgba(89b4faff) 45deg
    col.inactive_border = rgba(45475aff)
}

# Rounding
decoration {
    rounding = 12
}

# Custom blur settings
decoration {
    blur {
        enabled = true
        size = 8
        passes = 3
        noise = 0.02
        contrast = 1.0
        brightness = 1.0
    }
}

# Shadow customization
decoration {
    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(1a1a2eee)
    }
}

# Animation overrides (faster)
animations {
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    
    animation = windows, 1, 4, myBezier
    animation = windowsOut, 1, 4, default, popin 80%
    animation = fade, 1, 3, default
    animation = workspaces, 1, 4, default
}

# Disable animations completely (for performance)
# animations {
#     enabled = false
# }
