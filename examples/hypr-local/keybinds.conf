# Example local keybinds
# Copy to: ~/.config/hypr/local/keybinds.conf
# These will override/extend the core keybinds

$mainMod = SUPER

# Custom application launchers
bind = $mainMod, B, exec, firefox
bind = $mainMod, N, exec, nautilus
bind = $mainMod SHIFT, S, exec, spotify
bind = $mainMod SHIFT, D, exec, discord

# Custom workspace bindings (extra workspaces)
bind = $mainMod, F1, workspace, 11
bind = $mainMod, F2, workspace, 12
bind = $mainMod SHIFT, F1, movetoworkspace, 11
bind = $mainMod SHIFT, F2, movetoworkspace, 12

# Media controls
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Brightness controls (if not already bound)
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Custom screenshot bindings
bind = $mainMod, Print, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod SHIFT, Print, exec, grim - | wl-copy

# Toggle floating for current window
bind = $mainMod, V, togglefloating

# Pin window (stays on all workspaces)
bind = $mainMod, P, pin

# Fullscreen modes
bind = $mainMod, F, fullscreen, 0  # Real fullscreen
bind = $mainMod SHIFT, F, fullscreen, 1  # Maximize (keep bar)

# Gaming mode - disable animations
bind = $mainMod, G, exec, hyprctl keyword animations:enabled false
bind = $mainMod SHIFT, G, exec, hyprctl keyword animations:enabled true
